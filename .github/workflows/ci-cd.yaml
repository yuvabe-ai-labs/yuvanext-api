name: Deploy Hono API (Lambda + Docker)

on:
  push:
    branches:
      - development
      - staging
      - main
      - chore/cicd

env:
  NODE_VERSION: 20
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
  LAMBDA_ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  # Common secrets
  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
  ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
  ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
  ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------
      # Set environment-specific variables
      # --------------------
      - name: Set environment variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "FUNCTION_NAME=${{ secrets.FUNCTION_NAME_PROD }}" >> $GITHUB_ENV
            echo "DB_SECRET_NAME=${{ secrets.DATABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_PROD }}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "FUNCTION_NAME=${{ secrets.FUNCTION_NAME_STAGING }}" >> $GITHUB_ENV
            echo "DB_SECRET_NAME=${{ secrets.DATABASE_URL_STAGING }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=stag" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_STAGING }}" >> $GITHUB_ENV
          else
            echo "NODE_ENV=development" >> $GITHUB_ENV
            echo "FUNCTION_NAME=${{ secrets.FUNCTION_NAME_DEV }}" >> $GITHUB_ENV
            echo "DB_SECRET_NAME=${{ secrets.DATABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_DEV }}" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4

      # --------------------
      # Setup Node + pnpm
      # --------------------
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------
      # Run Database Migrations
      # --------------------
      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets[env.DB_SECRET_NAME] }}
        run: pnpm run db:migrate

      - name: Build project
        run: pnpm run build

      # --------------------
      # Configure AWS
      # --------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # --------------------
      # Build & Push Docker Image
      # --------------------
      - name: Build & Push Docker Image
        run: |
          IMAGE_URI=${{ env.ECR_REPO_URL }}:${{ env.IMAGE_TAG }}
          docker build -t backend-api:${{ env.IMAGE_TAG }} .
          docker tag backend-api:${{ env.IMAGE_TAG }} $IMAGE_URI
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # --------------------
      # Create or Update Lambda
      # --------------------
      - name: Create or Update Lambda
        env:
          DATABASE_URL: ${{ secrets[env.DB_SECRET_NAME] }}
        run: |
          set +e
          aws lambda get-function --function-name ${{ env.FUNCTION_NAME }} > /dev/null 2>&1
          EXISTS=$?
          set -e

          ENV_VARS="NODE_ENV=${{ env.NODE_ENV }},DATABASE_URL=$DATABASE_URL,BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET,BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }},SMTP_HOST=$SMTP_HOST,SMTP_PORT=$SMTP_PORT,SMTP_USER=$SMTP_USER,SMTP_PASSWORD=$SMTP_PASSWORD,BEDROCK_MODEL_ID=$BEDROCK_MODEL_ID,ZOOM_ACCOUNT_ID=$ZOOM_ACCOUNT_ID,ZOOM_CLIENT_ID=$ZOOM_CLIENT_ID,ZOOM_CLIENT_SECRET=$ZOOM_CLIENT_SECRET"

          if [ $EXISTS -ne 0 ]; then
            echo "🚀 Creating Lambda function: ${{ env.FUNCTION_NAME }}"
            aws lambda create-function \
              --function-name ${{ env.FUNCTION_NAME }} \
              --package-type Image \
              --code ImageUri=${{ env.IMAGE_URI }} \
              --role ${{ env.LAMBDA_ROLE_ARN }} \
              --timeout 15 \
              --memory-size 1024 \
              --environment Variables={$ENV_VARS}
            
            echo "⏳ Waiting for Lambda creation to complete..."
            aws lambda wait function-active \
              --function-name ${{ env.FUNCTION_NAME }}
          else
            echo "♻️ Updating Lambda function: ${{ env.FUNCTION_NAME }}"
            aws lambda update-function-code \
              --function-name ${{ env.FUNCTION_NAME }} \
              --image-uri ${{ env.IMAGE_URI }}
            
            echo "⏳ Waiting for Lambda code update to complete..."
            aws lambda wait function-updated \
              --function-name ${{ env.FUNCTION_NAME }}
            
            echo "🔧 Updating Lambda configuration..."
            aws lambda update-function-configuration \
              --function-name ${{ env.FUNCTION_NAME }} \
              --environment Variables={$ENV_VARS}
            
            echo "⏳ Waiting for Lambda configuration update to complete..."
            aws lambda wait function-updated \
              --function-name ${{ env.FUNCTION_NAME }}
          fi

          echo "✅ Lambda deployment completed successfully!"
