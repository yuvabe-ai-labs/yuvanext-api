name: Deploy Hono API (Lambda + Docker)

on:
  push:
    branches:
      - development
      - stagging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - branch: development
            env: dev
            db_secret: DATABASE_URL_DEV
          - branch: stagging
            env: stag
            db_secret: DATABASE_URL_STAGING
          - branch: main
            env: prod
            db_secret: DATABASE_URL_PROD

    environment: ${{ matrix.env }}

    steps:
      # --------------------
      # Skip jobs if branch does not match matrix
      # --------------------
      - name: Check branch
        if: github.ref != 'refs/heads/' + matrix.branch
        run: echo "Skipping this job for branch ${{ github.ref }}" && exit 0

      # --------------------
      # Checkout repo
      # --------------------
      - uses: actions/checkout@v4

      # --------------------
      # Setup Node + pnpm
      # --------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # --------------------
      # Configure AWS
      # --------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      # --------------------
      # Build & Push Docker Image
      # --------------------
      - name: Build & Push Docker Image
        env:
          IMAGE_REPO: ${{ secrets.ECR_REPO_URL }}
        run: |
          IMAGE_URI=$IMAGE_REPO:${{ matrix.env }}
          docker build -t backend-api:${{ matrix.env }} .
          docker tag backend-api:${{ matrix.env }} $IMAGE_URI
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # --------------------
      # Create or Update Lambda
      # --------------------
      - name: Create or Update Lambda
        env:
          FUNCTION_NAME: hono-api-${{ matrix.env }}
          ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
          DATABASE_URL: ${{ secrets[matrix.db_secret] }}
        run: |
          set +e
          aws lambda get-function --function-name $FUNCTION_NAME > /dev/null 2>&1
          EXISTS=$?
          set -e

          if [ $EXISTS -ne 0 ]; then
            echo "🚀 Creating Lambda function: $FUNCTION_NAME"
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --package-type Image \
              --code ImageUri=$IMAGE_URI \
              --role $ROLE_ARN \
              --timeout 15 \
              --memory-size 1024 \
              --environment Variables="{NODE_ENV=${{ matrix.env }},DATABASE_URL=$DATABASE_URL}"
          else
            echo "♻️ Updating Lambda function: $FUNCTION_NAME"
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --image-uri $IMAGE_URI

            aws lambda update-function-configuration \
              --function-name $FUNCTION_NAME \
              --environment Variables="{NODE_ENV=${{ matrix.env }},DATABASE_URL=$DATABASE_URL}"
