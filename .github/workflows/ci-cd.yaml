name: Deploy Hono API (Lambda + Docker)

on:
  push:
    branches:
      - development
      - staging
      - main

env:
  NODE_VERSION: 20
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
  LAMBDA_ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
  BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
  ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
  ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
  ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Set environment per branch
      # -----------------------------
      - name: Set environment variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "FUNCTION_NAME=${{ secrets.FUNCTION_NAME_PROD }}" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_PROD }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_PROD }}" >> $GITHUB_ENV
            echo "S3_BUCKET_NAME=${{ secrets.BUCKET_NAME_PROD }}" >> $GITHUB_ENV
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL_PROD }}" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "NODE_ENV=staging" >> $GITHUB_ENV
            echo "FUNCTION_NAME=${{ secrets.FUNCTION_NAME_STAGING }}" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=stag" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_STAGING }}" >> $GITHUB_ENV
            echo "S3_BUCKET_NAME=${{ secrets.BUCKET_NAME_STAGING }}" >> $GITHUB_ENV
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL_STAGING }}" >> $GITHUB_ENV
          else
            echo "NODE_ENV=development" >> $GITHUB_ENV
            echo "FUNCTION_NAME=${{ secrets.FUNCTION_NAME_DEV }}" >> $GITHUB_ENV
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=${{ secrets.BETTER_AUTH_URL_DEV }}" >> $GITHUB_ENV
            echo "S3_BUCKET_NAME=${{ secrets.BUCKET_NAME_DEV }}" >> $GITHUB_ENV
            echo "FRONTEND_URL=${{ secrets.FRONTEND_URL_DEV }}" >> $GITHUB_ENV
          fi

      # -----------------------------
      # Node + pnpm
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm run db:migrate

      - run: pnpm run build

      # -----------------------------
      # AWS Auth + ECR login
      # -----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        run: |
          IMAGE_URI=${{ env.ECR_REPO_URL }}:$IMAGE_TAG

          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -t $IMAGE_URI \
            --push .

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # -----------------------------
      # Deploy Lambda
      # -----------------------------
      - name: Deploy Lambda
        env:
          FUNCTION_NAME: ${{ env.FUNCTION_NAME }}
          IMAGE_URI: ${{ env.IMAGE_URI }}
          NODE_ENV: ${{ env.NODE_ENV }}
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_URL: ${{ env.BETTER_AUTH_URL }}
          S3_BUCKET_NAME: ${{ env.S3_BUCKET_NAME }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
        run: |
          set +e
          aws lambda get-function --function-name $FUNCTION_NAME > /dev/null 2>&1
          EXISTS=$?
          set -e

          ENV_JSON=$(jq -n \
            --arg NODE_ENV "$NODE_ENV" \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET" \
            --arg BETTER_AUTH_URL "$BETTER_AUTH_URL" \
            --arg SMTP_HOST "$SMTP_HOST" \
            --arg SMTP_PORT "$SMTP_PORT" \
            --arg SMTP_USER "$SMTP_USER" \
            --arg SMTP_PASSWORD "$SMTP_PASSWORD" \
            --arg BEDROCK_MODEL_ID "$BEDROCK_MODEL_ID" \
            --arg ZOOM_ACCOUNT_ID "$ZOOM_ACCOUNT_ID" \
            --arg ZOOM_CLIENT_ID "$ZOOM_CLIENT_ID" \
            --arg ZOOM_CLIENT_SECRET "$ZOOM_CLIENT_SECRET" \
            --arg S3_BUCKET_NAME "$S3_BUCKET_NAME" \
            --arg FRONTEND_URL "$FRONTEND_URL" \
            '{Variables: {
              NODE_ENV: $NODE_ENV,
              DATABASE_URL: $DATABASE_URL,
              BETTER_AUTH_SECRET: $BETTER_AUTH_SECRET,
              BETTER_AUTH_URL: $BETTER_AUTH_URL,
              SMTP_HOST: $SMTP_HOST,
              SMTP_PORT: $SMTP_PORT,
              SMTP_USER: $SMTP_USER,
              SMTP_PASSWORD: $SMTP_PASSWORD,
              BEDROCK_MODEL_ID: $BEDROCK_MODEL_ID,
              ZOOM_ACCOUNT_ID: $ZOOM_ACCOUNT_ID,
              ZOOM_CLIENT_ID: $ZOOM_CLIENT_ID,
              ZOOM_CLIENT_SECRET: $ZOOM_CLIENT_SECRET,
              S3_BUCKET_NAME: $S3_BUCKET_NAME,
              FRONTEND_URL: $FRONTEND_URL
            }}')

          if [ $EXISTS -ne 0 ]; then
            aws lambda create-function \
              --function-name $FUNCTION_NAME \
              --package-type Image \
              --code ImageUri=$IMAGE_URI \
              --role ${{ env.LAMBDA_ROLE_ARN }} \
              --timeout 15 \
              --memory-size 1024 \
              --environment "$ENV_JSON"
          else
            aws lambda update-function-code \
              --function-name $FUNCTION_NAME \
              --image-uri $IMAGE_URI

            aws lambda update-function-configuration \
              --function-name $FUNCTION_NAME \
              --environment "$ENV_JSON"
          fi

          echo "🎉 Deployment successful"
