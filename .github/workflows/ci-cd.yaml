name: Deploy Hono API (Lambda + Docker)

on:
  push:
    branches:
      - development
      - stagging
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------
      # Set environment variables based on branch
      # --------------------
      - name: Set environment variables
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "FUNCTION_NAME=yuvanext-api-prod" >> $GITHUB_ENV
            echo "DB_SECRET_NAME=DATABASE_URL_PROD" >> $GITHUB_ENV
            echo "IMAGE_TAG=prod" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=https://api.yuvanext.com" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/stagging" ]; then
            echo "NODE_ENV=production" >> $GITHUB_ENV
            echo "FUNCTION_NAME=yuvanext-api-stag" >> $GITHUB_ENV
            echo "DB_SECRET_NAME=DATABASE_URL_STAGING" >> $GITHUB_ENV
            echo "IMAGE_TAG=stag" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=https://api-staging.yuvanext.com" >> $GITHUB_ENV
          else
            echo "NODE_ENV=development" >> $GITHUB_ENV
            echo "FUNCTION_NAME=yuvanext-api-dev" >> $GITHUB_ENV
            echo "DB_SECRET_NAME=DATABASE_URL_DEV" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "BETTER_AUTH_URL=https://api-dev.yuvanext.com" >> $GITHUB_ENV
          fi

      # --------------------
      # Checkout repo
      # --------------------
      - uses: actions/checkout@v4

      # --------------------
      # Setup Node + pnpm
      # --------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      # --------------------
      # Configure AWS
      # --------------------
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # --------------------
      # Build & Push Docker Image
      # --------------------
      - name: Build & Push Docker Image
        env:
          IMAGE_REPO: ${{ secrets.ECR_REPO_URL }}
        run: |
          IMAGE_URI=$IMAGE_REPO:${{ env.IMAGE_TAG }}
          docker build -t backend-api:${{ env.IMAGE_TAG }} .
          docker tag backend-api:${{ env.IMAGE_TAG }} $IMAGE_URI
          docker push $IMAGE_URI
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # --------------------
      # Create or Update Lambda
      # --------------------
      - name: Create or Update Lambda
        env:
          ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
          DATABASE_URL: ${{ secrets[env.DB_SECRET_NAME] }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          Better_AUTH_URL: ${{ env.BETTER_AUTH_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
        run: |
          set +e
          aws lambda get-function --function-name ${{ env.FUNCTION_NAME }} > /dev/null 2>&1
          EXISTS=$?
          set -e

          if [ $EXISTS -ne 0 ]; then
            echo "🚀 Creating Lambda function: ${{ env.FUNCTION_NAME }}"
            aws lambda create-function \
              --function-name ${{ env.FUNCTION_NAME }} \
              --package-type Image \
              --code ImageUri=$IMAGE_URI \
              --role $ROLE_ARN \
              --timeout 15 \
              --memory-size 1024 \
              --environment Variables="{NODE_ENV=${{ env.NODE_ENV }},DATABASE_URL=$DATABASE_URL,BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET,BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }},SMTP_HOST=$SMTP_HOST,SMTP_PORT=$SMTP_PORT,SMTP_USER=$SMTP_USER,SMTP_PASSWORD=$SMTP_PASSWORD,BEDROCK_MODEL_ID=$BEDROCK_MODEL_ID,ZOOM_ACCOUNT_ID=$ZOOM_ACCOUNT_ID,ZOOM_CLIENT_ID=$ZOOM_CLIENT_ID,ZOOM_CLIENT_SECRET=$ZOOM_CLIENT_SECRET}"
          else
            echo "♻️ Updating Lambda function: ${{ env.FUNCTION_NAME }}"
            aws lambda update-function-code \
              --function-name ${{ env.FUNCTION_NAME }} \
              --image-uri $IMAGE_URI

            echo "⏳ Waiting for Lambda code update to complete..."
            aws lambda wait function-updated \
              --function-name ${{ env.FUNCTION_NAME }}

            echo "🔧 Updating Lambda configuration..."
            aws lambda update-function-configuration \
              --function-name ${{ env.FUNCTION_NAME }} \
              --environment Variables="{NODE_ENV=${{ env.NODE_ENV }},DATABASE_URL=$DATABASE_URL,BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET,BETTER_AUTH_URL=${{ env.BETTER_AUTH_URL }},SMTP_HOST=$SMTP_HOST,SMTP_PORT=$SMTP_PORT,SMTP_USER=$SMTP_USER,SMTP_PASSWORD=$SMTP_PASSWORD,BEDROCK_MODEL_ID=$BEDROCK_MODEL_ID,ZOOM_ACCOUNT_ID=$ZOOM_ACCOUNT_ID,ZOOM_CLIENT_ID=$ZOOM_CLIENT_ID,ZOOM_CLIENT_SECRET=$ZOOM_CLIENT_SECRET}"
          fi
